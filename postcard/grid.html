<!doctype html>
<!-- Postcard option 1 (Grid), 6 x 4 in trim. Filled in by scripts/postcard.mjs; {{...}} are replaced there.
     Print files add a 1/8 in bleed on every side (page 6.25 x 4.25 in): the background and edge lines run into it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Postcard · {{NAME}}</title>
<style>
/* Frontify's official text font (ABC Diatype), served from the site's own font files */
@font-face { font-family: 'ABC Diatype'; src: url('../public/fonts/ABCDiatype-Regular.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'ABC Diatype'; src: url('../public/fonts/ABCDiatype-Medium.woff2') format('woff2'); font-weight: 500; }
@page { size: {{PAGE_W}} {{PAGE_H}}; margin: 0; }
html, body { margin: 0; padding: 0; }
* { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { position: relative; width: 576px; height: 384px; background: #F0F0EB; overflow: hidden; }
.page.bleed { width: 600px; height: 408px; }
.page.bleed .card { position: absolute; left: 12px; top: 12px; }
.ext { display: none; }
.page.bleed .ext { display: block; position: absolute; inset: 0; }
.ext div { position: absolute; background: #111110; }
.ext .h-top { left: 0; right: 0; top: 83px; height: 1px; }
.ext .v-mid { left: 404px; top: 0; width: 1px; height: 13px; }
.ext .grid-up { left: 152px; top: 0; width: 252px; height: 12px; background: linear-gradient(90deg, #111110 1px, transparent 1px); background-size: 28px 100%; }
.ext .h-qr { left: 588px; right: 0; top: 239px; height: 1px; }
.ext .bottom-ext { left: 0; right: 0; top: 368px; bottom: 0; background: #F0F0EB linear-gradient(90deg, #111110 1px, transparent 1px); background-size: 28px 100%; background-position: 12px 0; border-top: 1px solid #111110; }
.card { width: 576px; height: 384px; box-sizing: border-box; background: #F0F0EB; color: #111110; font-family: 'ABC Diatype', Verdana, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
.top { height: 72px; box-sizing: border-box; display: flex; border-bottom: 1px solid #111110; flex-shrink: 0; }
.logo { width: 140px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 3px; }
.logo img { height: 20px; width: auto; display: block; }
.small { font-size: 10px; line-height: 1.2; }
.gridcells { width: 252px; flex-shrink: 0; background-image: linear-gradient(transparent 35px, #111110 35px, #111110 36px, transparent 36px), linear-gradient(90deg, #111110 1px, transparent 1px); background-size: 100% 72px, 28px 100%; background-repeat: no-repeat, repeat-x; }
.pair { width: 184px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-left: 1px solid #111110; font-size: 14px; font-weight: 400; }
/* The company's own logo, one color (Base black), sized by area so wide and square logos look balanced */
.plogo { display: block; }
.mid { flex-grow: 1; display: flex; min-height: 0; }
.note { flex-grow: 1; padding: 20px 28px 14px; display: flex; flex-direction: column; gap: 10px; }
.lines { flex-grow: 1; background-image: {{LINES}}; }
.side { width: 184px; box-sizing: border-box; flex-shrink: 0; border-left: 1px solid #111110; display: flex; flex-direction: column; }
.qr { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-bottom: 1px solid #111110; }
.qr svg { width: 128px; height: 128px; display: block; }
.tap { height: 128px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.tap span { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.ring { width: 104px; height: 104px; box-sizing: border-box; border: 1px solid #111110; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.guide { width: 95px; height: 95px; box-sizing: border-box; border: 1.5px dashed #767676; border-radius: 50%; display: {{GUIDE}}; }
.bottom { height: 28px; box-sizing: border-box; flex-shrink: 0; border-top: 1px solid #111110; background-image: linear-gradient(90deg, #111110 1px, transparent 1px); background-size: 28px 100%; background-position: 0 0; }
</style>
</head>
<body>
<div class="page {{BLEED_CLASS}}">
<div class="ext" aria-hidden="true"><div class="bottom-ext"></div><div class="h-top"></div><div class="v-mid"></div><div class="grid-up"></div><div class="h-qr"></div></div>
<div class="card">
  <div class="top">
    <div class="logo"><img src="frontify-lockup-dark.svg" alt="Frontify"><span class="small">www.frontify.com</span></div>
    <div class="gridcells"></div>
    <div class="pair">{{PAIR}}</div>
  </div>
  <div class="mid">
    <div class="note">
      <div class="lines" aria-label="Space for a handwritten note"></div>
      <span class="small">{{SENDER_NAME}} · {{SENDER_ROLE}} · {{SENDER_EMAIL}}</span>
    </div>
    <div class="side">
      <div class="qr">{{QR_SVG}}<span class="small" style="white-space: nowrap">{{DOMAIN}}/{{SLUG}}</span></div>
      <div class="tap">
        <span><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.5 5.2a2.6 2.6 0 0 1 0 3.6M6.5 3.4a5.2 5.2 0 0 1 0 7.2M9.5 1.6a7.8 7.8 0 0 1 0 10.8" stroke="#111110" stroke-width="1.3" stroke-linecap="round"/></svg>Or tap your phone here</span>
        <div class="ring"><div class="guide"></div></div>
      </div>
    </div>
  </div>
  <div class="bottom"></div>
</div>
</div>
</body>
</html>
